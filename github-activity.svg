    <text x="450" y="186" fill="#d4943a" font-size="15" font-weight="700" text-anchor="end">667</text>
  </g>
  <text x="30" y="236" fill="#8a7f6f" font-size="11" font-family="'Segoe UI', Ubuntu, system-ui, sans-serif">Real commits summed by author email across my SporeSec and personal accounts and my old address. Cyvore shown as its public contribution count.</text>
